# Local development database.
#
# Mirrors the managed Postgres the Replit deployment runs against, so the API
# server talks to a real Postgres instance locally — same driver, same SQL, same
# jsonb semantics. Nothing about the server's storage path is substituted.
#
#   docker compose up -d db     # start
#   docker compose down         # stop (keeps data)
#   docker compose down -v      # stop and wipe the map
#
# Credentials are deliberately trivial: this listens on localhost only and holds
# nothing but local test maps.

services:
  db:
    image: postgres:16-alpine
    container_name: mind-canvas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindcanvas
      POSTGRES_PASSWORD: mindcanvas
      POSTGRES_DB: mindcanvas
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - mind-canvas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mindcanvas -d mindcanvas']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  mind-canvas-pgdata:
